<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Inline SVG favicon: no third-party request on first paint. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050505'/%3E%3Ctext x='16' y='24' font-family='monospace' font-size='22' font-weight='700' fill='%23ccff00' text-anchor='middle'%3EU%3C/text%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="UniArchives — a shared, slot-aware commons of notes, question banks and solutions for university courses." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#050505" />
    <title>UniArchives | Resource Commons</title>

    <!--
      Fonts are self-hosted (public/fonts, latin subset, woff2) instead of loaded
      from fonts.googleapis.com: no third-party DNS/TLS handshake, no
      render-blocking stylesheet, and they can be served immutable + cached.
      Only the two faces needed above the fold are preloaded; the rest arrive
      with the font-display: swap rules in index.css.
    -->
    <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/unbounded-800.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Theme colour before JS runs, so the first paint is not white. -->
    <style>
      html { background-color: #050505; }
      html[data-theme='light'] { background-color: #fafafa; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
